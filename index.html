<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abhishek Anand | Portfolio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-brand" id="nav-brand">AA</div>
      <div class="nav-links">
        <a href="#about">About</a>
        <a href="#experience">Experience</a>
        <a href="#projects">Projects</a>
        <a href="#skills">Skills</a>
        <a href="#education">Education</a>
      </div>
    </nav>

    <main class="wrapper">
      <section id="about" class="hero-section">
        <div id="hero-content"></div>
        <div id="stats-grid" class="stats-grid"></div>
      </section>

      <section id="experience" class="section">
        <div class="section-title-box">
          <h2>01 / EXPERIENCE</h2>
        </div>
        <div id="experience-list" class="cards-stack"></div>
      </section>

      <section id="projects" class="section">
        <div class="section-title-box">
          <h2>02 / FEATURED PROJECTS</h2>
        </div>
        <div id="projects-grid" class="projects-grid"></div>
      </section>

      <section id="skills" class="section">
        <div class="section-title-box">
          <h2>03 / TECHNICAL SKILLS</h2>
        </div>
        <div id="skills-container" class="skills-box"></div>
      </section>

      <section id="education" class="section">
        <div class="section-title-box">
          <h2>04 / EDUCATION</h2>
        </div>
        <div id="education-container"></div>
      </section>
    </main>

    <footer class="footer">
      <div class="footer-content" id="footer-content"></div>
    </footer>

    <script src="js/render.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
